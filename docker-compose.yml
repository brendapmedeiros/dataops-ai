services:
  api:
    build:
      context: .
    container_name: dataops_ai_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dataops_ai
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: dataops_ai_postgres
    environment:
      POSTGRES_DB: dataops_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dataops_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataops_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dataops_ai_postgres_data:
