name: CI-CD DataOps AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # rodo os testes unitarios do backend python
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configuro python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalo dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Executo suite de testes
        run: pytest

  # valido build e tipos do novo frontend react
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configuro node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalo dependencias do frontend
        run: |
          cd frontend
          npm ci

      - name: Build do frontend
        run: |
          cd frontend
          npm run build

  # valido a sintaxe e conformidade dos arquivos terraform
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configuro o terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Verifico formatacao do terraform
        run: terraform fmt -check infra/

      - name: Valido configuracoes do terraform
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  # publico os servicos no cloud run apenas na branch main quando as credenciais existirem
  deploy:
    needs: [test-backend, test-frontend, validate-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Autentico no gcp via workload identity federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configuro gcloud cli
        uses: google-github-actions/setup-gcloud@v2

      - name: Autentico no artifact registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build e push da imagem api
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/api:${{ env.IMAGE_TAG }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/api:latest .
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/api:${{ env.IMAGE_TAG }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/api:latest

      - name: Build e push da imagem dashboard (streamlit)
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/dashboard:${{ env.IMAGE_TAG }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/dashboard:latest .
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/dashboard:${{ env.IMAGE_TAG }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/dashboard:latest

      - name: Build e push da imagem frontend (react)
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/frontend:latest ./frontend
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/frontend:latest

      - name: Deploy do servico cloud run da api
        run: |
          gcloud run deploy dataops-api \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/api:${{ env.IMAGE_TAG }} \
            --region ${{ env.GCP_REGION }} \
            --quiet

      - name: Deploy do servico cloud run do dashboard
        run: |
          gcloud run deploy dataops-dashboard \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/dashboard:${{ env.IMAGE_TAG }} \
            --region ${{ env.GCP_REGION }} \
            --port 8501 \
            --command streamlit \
            --args "run,dashboard/app.py,--server.port,8501,--server.address,0.0.0.0,--server.headless,true" \
            --quiet

      - name: Deploy do servico cloud run do frontend react
        run: |
          gcloud run deploy dataops-frontend \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/dataops-ai/frontend:${{ env.IMAGE_TAG }} \
            --region ${{ env.GCP_REGION }} \
            --port 80 \
            --quiet
